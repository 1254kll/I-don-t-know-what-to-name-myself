name: Build Mod

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    # 【核心修复】自动去除所有 Java 文件开头的 BOM 隐藏字符，解决 Linux 报错
    - name: Remove UTF-8 BOM from Java files
      run: |
        find . -name "*.java" -exec sed -i '1s/^\xEF\xBB\xBF//' {} \;

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build with Gradle
      run: ./gradlew build

    - name: Upload JAR
      uses: actions/upload-artifact@v4
      with:
        name: Mod-Jar
        path: build/libs/*.jar
